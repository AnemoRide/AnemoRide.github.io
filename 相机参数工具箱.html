<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相机参数工具箱 · Camera Toolbox</title>
<meta name="description" content="48 项相机参数计算：画幅视场、景深对焦、曝光、闪光、视频数据、天文航拍、打印色彩。纯离线单页，打开即用。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317191A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23F2F3F0' stroke-width='2'/%3E%3Cpath d='M16 7 L19.6 13.5 L16 16 Z' fill='%23A32B22'/%3E%3Cpath d='M23.8 12.5 L19.6 18.5 L16 16 Z' fill='%23F2F3F0'/%3E%3Cpath d='M23.8 19.5 L16.8 19.5 L16 16 Z' fill='%23F2F3F0'/%3E%3Cpath d='M16 25 L12.4 18.5 L16 16 Z' fill='%23F2F3F0'/%3E%3Cpath d='M8.2 19.5 L12.4 13.5 L16 16 Z' fill='%23F2F3F0'/%3E%3Cpath d='M8.2 12.5 L15.2 12.5 L16 16 Z' fill='%23F2F3F0'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F2F3F0;
  --card:#FFFFFF;
  --ink:#17191A;
  --ink-soft:#3A3E40;
  --muted:#6B7076;
  --line:#D8DAD5;
  --line-soft:#E6E7E3;
  --accent:#A32B22;
  --accent-ink:#7E211A;
  --accent-wash:#F5E8E5;
  --radius:3px;
  --sidebar:264px;
  --mono:"SFMono-Regular","Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(to right,rgba(23,25,26,.045) 1px,transparent 1px);
  background-size:24px 100%;
  opacity:.6;
}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===================== 布局：窄屏先写 ===================== */
.shell{position:relative;z-index:1}
.scrim{
  position:fixed;inset:0;background:rgba(23,25,26,.45);
  opacity:0;visibility:hidden;transition:opacity .18s ease;z-index:40;
}
.side{
  position:fixed;top:0;left:0;bottom:0;width:min(86vw,300px);
  background:var(--card);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(-102%);
  transition:transform .22s cubic-bezier(.22,.61,.36,1);
  z-index:50;
}
.side.open{transform:translateX(0)}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:rgba(242,243,240,.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.iconbtn{
  width:40px;height:40px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);cursor:pointer;padding:0;
}
.iconbtn svg{width:18px;height:18px}
.topbar .tbrand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.topbar .tbrand b{font-size:14px;letter-spacing:.02em}
.topbar .tbrand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
main{padding:20px 16px 72px;max-width:1120px;margin:0 auto}

/* ===================== 侧边栏 ===================== */
.brand{
  padding:20px 18px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.brand svg{width:34px;height:34px;flex:none}
.brand .txt{min-width:0}
.brand b{display:block;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.side-search{padding:14px 14px 10px}
.searchwrap{position:relative}
.searchwrap svg{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--muted);pointer-events:none;
}
.side-search input{
  width:100%;height:36px;padding:0 10px 0 30px;font-size:14px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:#FBFBF9;color:var(--ink);font-family:var(--sans);
}
.side-search input::placeholder{color:#9A9E9C}
.side-search input:focus{outline:none;border-color:var(--ink);background:#fff}
.nav{overflow-y:auto;flex:1;padding:4px 8px 20px;overscroll-behavior:contain}
.group{margin-top:14px}
.group h6{
  margin:0 0 4px;padding:0 8px;
  font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.12em;color:var(--muted);
}
.group h6 .dot{color:var(--accent);margin-right:6px}
.navlink{
  display:flex;align-items:baseline;gap:8px;
  padding:7px 8px;border-radius:var(--radius);
  text-decoration:none;color:var(--ink-soft);
  font-size:13.5px;line-height:1.35;border-left:2px solid transparent;
}
.navlink .code{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;width:16px;
}
.navlink span{min-width:0}
.navlink:hover{background:#F7F7F4;color:var(--ink)}
.navlink.active{
  background:var(--accent-wash);color:var(--accent-ink);
  border-left-color:var(--accent);font-weight:600;
}
.navlink.active .code{color:var(--accent)}
.side-foot{
  border-top:1px solid var(--line);padding:12px 18px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px;
}
#emptyhint{
  display:none;padding:18px 10px;font-size:12.5px;color:var(--muted);
}
#emptyhint.on{display:block}

/* ===================== 首页 ===================== */
.hero{padding:8px 0 22px;border-bottom:1px solid var(--line)}
.hero .kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.hero .kicker::after{content:"";height:1px;flex:1;background:var(--line)}
.hero h1{
  margin:0 0 10px;font-size:clamp(26px,5.2vw,40px);line-height:1.12;
  letter-spacing:-.01em;font-weight:600;
}
.hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:62ch}
.hero .stats{
  display:flex;flex-wrap:wrap;gap:22px;margin-top:18px;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);
}
.hero .stats b{display:block;font-size:20px;letter-spacing:0;color:var(--ink);font-weight:600}
.hero-inner{display:grid;gap:22px}
.ref{
  border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
  padding:12px 13px 6px;
}
.ref h5{
  margin:0 0 9px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--muted);
}
.ref h5 em{font-style:normal;color:var(--accent);letter-spacing:.06em}
.ref table{width:100%;border-collapse:collapse;table-layout:fixed}
.ref th{
  text-align:left;font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.06em;color:var(--muted);padding:0 0 5px;
}
.ref td{
  font-size:12px;color:var(--ink-soft);padding:6px 0;
  border-top:1px dashed var(--line-soft);vertical-align:baseline;
}
.ref td.d{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ref td.c{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.ref .foot{
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.5;
}
.groups{margin-top:26px}
.gcard{
  border:1px solid var(--line);background:var(--card);
  border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:12px;
}
.gcard .ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.gcard .ghead h3{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em}
.gcard .ghead em{
  font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.1em;
}
.gcard .gl{display:flex;flex-direction:column;gap:0}
.gcard .gl a{
  display:flex;gap:10px;align-items:baseline;text-decoration:none;
  padding:5px 0;border-top:1px dashed var(--line-soft);font-size:13.5px;color:var(--ink-soft);
}
.gcard .gl a:first-child{border-top:0}
.gcard .gl a:hover{color:var(--accent-ink)}
.gcard .gl a i{font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--muted);width:16px;flex:none}

/* ===================== 计算器页 ===================== */
.crumb{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);
  padding-bottom:14px;
}
.crumb a{text-decoration:none;color:var(--muted)}
.crumb a:hover{color:var(--accent)}
.crumb .sep{color:var(--line)}
.crumb .cur{color:var(--ink)}
.chead{display:flex;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.chead .num{
  font-family:var(--mono);font-size:clamp(30px,6vw,44px);line-height:1;font-weight:500;
  color:var(--accent);letter-spacing:-.02em;flex:none;padding-top:2px;
}
.chead .meta{min-width:0}
.chead h2{margin:0 0 6px;font-size:clamp(20px,3.6vw,27px);line-height:1.2;font-weight:600;letter-spacing:-.005em}
.chead p{margin:0;color:var(--muted);font-size:13.5px;max-width:58ch}
.chead .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  border:1px solid var(--line);border-radius:2px;padding:2px 6px;color:var(--muted);
}

.panel{
  border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
  margin-top:20px;
}
.panel .phead{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line);
}
.panel .phead h4{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft)}
.panel .phead .tools{display:flex;gap:6px}
.minibtn{
  border:1px solid var(--line);background:#FBFBF9;color:var(--ink-soft);
  font-size:11.5px;padding:4px 9px;border-radius:2px;cursor:pointer;
  min-height:26px;
}
.minibtn:hover{border-color:var(--ink);color:var(--ink)}
.minibtn:active{background:#F0F0EC}
.pbody{padding:14px}
.fields{display:grid;grid-template-columns:1fr;gap:12px 18px}
.f label{
  display:block;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-bottom:5px;
}
.f .inwrap{position:relative;display:flex;align-items:center}
.f input[type=number],.f select,.f input[type=text]{
  width:100%;height:40px;font-size:16px;
  padding:0 10px;border:1px solid var(--line);border-radius:2px;
  background:#FBFBF9;color:var(--ink);font-family:var(--mono);
  -moz-appearance:textfield;
}
.f input[type=number]::-webkit-outer-spin-button,
.f input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f select{font-family:var(--sans);font-size:14.5px;appearance:none;padding-right:28px}
.f .inwrap .chev{position:absolute;right:10px;pointer-events:none;width:12px;height:12px;color:var(--muted)}
.f input:focus,.f select:focus{outline:none;border-color:var(--ink);background:#fff}
.f .unit{
  position:absolute;right:10px;font-family:var(--mono);font-size:11px;color:var(--muted);
  pointer-events:none;letter-spacing:.02em;
}
.f .hint{display:block;font-size:11px;color:#9A9E9C;margin-top:4px;font-family:var(--mono)}
.f.hide{display:none}

/* 结果 */
.res{
  margin-top:20px;border-top:1px solid var(--ink);padding-top:14px;
}
.res .rlabel{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.res .rlabel::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.out .k{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.02em}
.out .v{
  display:block;font-family:var(--mono);font-size:17px;line-height:1.35;
  color:var(--ink);letter-spacing:-.01em;word-break:break-word;
}
.out.wide{grid-column:1 / -1}
.out .v.big{font-size:22px}
.out .v.accent{color:var(--accent-ink)}
.tbl{margin-top:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;table-layout:fixed}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th:first-child,td:first-child{text-align:left}
th{
  font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted);
  border-bottom:1px solid var(--line);letter-spacing:.02em;
}
.note{
  margin-top:16px;padding:10px 12px;background:#FAFAF6;border:1px solid var(--line-soft);
  border-left:2px solid var(--accent);font-size:12.5px;color:var(--ink-soft);line-height:1.65;
}
.note b{color:var(--accent-ink);font-weight:600}
.err{
  margin-top:16px;padding:10px 12px;background:#F7E7E4;border:1px solid #E4C3BD;
  font-size:12.5px;color:#7E211A;
}
.pager{
  display:flex;justify-content:space-between;gap:10px;margin-top:28px;
  border-top:1px solid var(--line);padding-top:14px;
}
.pager a{
  text-decoration:none;font-size:12.5px;color:var(--ink-soft);
  display:flex;flex-direction:column;gap:2px;max-width:48%;
}
.pager a b{font-weight:600;font-size:13px}
.pager a span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.pager a:hover b{color:var(--accent)}
.pager .next{text-align:right;margin-left:auto}

/* 回到顶部 / toast */
.ft{
  margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;
  display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;
}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:var(--ink);color:#F2F3F0;padding:9px 14px;border-radius:2px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:.18s ease;z-index:60;
  letter-spacing:.02em;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===================== 桌面端 ===================== */
@media (min-width:900px){
  body::before{background-size:32px 100%}
  .topbar{display:none}
  .scrim{display:none}
  .side{
    width:var(--sidebar);transform:none;
    box-shadow:none;
  }
  main{
    margin-left:var(--sidebar);
    max-width:none;padding:28px 40px 80px;
  }
  .container{max-width:1020px;margin:0 auto}
  .fields{grid-template-columns:1fr 1fr}
  .fields.three{grid-template-columns:1fr 1fr 1fr}
  .outgrid{grid-template-columns:repeat(4,1fr)}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .gcard{margin:0}
  .gcard.span2{grid-column:1/-1}
  .gcard.span2 .gl{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
  .gcard.span2 .gl a{border-top:0;padding:6px 0}
  .hero{padding-bottom:26px}
  .hero-inner{grid-template-columns:minmax(0,1fr) 304px;gap:32px;align-items:start}
  .chead{gap:22px}
}
@media (min-width:1280px){
  main{padding-left:56px;padding-right:56px}
  .container{max-width:1100px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="打开目录" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="tbrand">
      <b>相机参数工具箱</b>
      <span>48 CALC · OFFLINE</span>
    </div>
  </header>

  <aside class="side" id="side" aria-label="功能目录">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" fill="#17191A"/>
        <circle cx="16" cy="16" r="9.2" fill="none" stroke="#F2F3F0" stroke-width="1.6"/>
        <path d="M16 7 L19.6 13.5 L16 16 Z" fill="#A32B22"/>
        <path d="M23.8 12.5 L19.6 18.5 L16 16 Z" fill="#F2F3F0"/>
        <path d="M23.8 19.5 L16.8 19.5 L16 16 Z" fill="#F2F3F0"/>
        <path d="M16 25 L12.4 18.5 L16 16 Z" fill="#F2F3F0"/>
        <path d="M8.2 19.5 L12.4 13.5 L16 16 Z" fill="#F2F3F0"/>
        <path d="M8.2 12.5 L15.2 12.5 L16 16 Z" fill="#F2F3F0"/>
      </svg>
      <div class="txt">
        <b>相机参数工具箱</b>
        <small>CAMERA TOOLBOX</small>
      </div>
    </div>
    <div class="side-search">
      <div class="searchwrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="搜索功能，如 景深、ND、GSD" autocomplete="off">
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div id="emptyhint">没有匹配的功能。试试「焦距」「曝光」「星轨」。</div>
    <div class="side-foot"><span>48 CALC</span><span>v3.0</span></div>
  </aside>

  <main>
    <div class="container" id="view"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   基础数据：传感器规格（与 Python 版一致，共 14 档）
   ============================================================ */
var SENSORS = [
  { n: '1/3.2" 手机', w: 4.54, h: 3.42, u: '前置 / 入门手机' },
  { n: '1/2.3"', w: 6.17, h: 4.55, u: '卡片机 / 无人机' },
  { n: '1/1.7"', w: 7.60, h: 5.70, u: '高端卡片机' },
  { n: '1/1.3"', w: 9.60, h: 7.20, u: '大底手机' },
  { n: '1"', w: 13.20, h: 8.80, u: 'RX100 / Mavic 3' },
  { n: 'M4/3', w: 17.30, h: 13.00, u: 'M4/3 系统' },
  { n: 'APS-C 佳能', w: 22.30, h: 14.90, u: '1.6 倍裁切' },
  { n: 'APS-C 索/尼/富', w: 23.50, h: 15.60, u: '1.5 倍裁切' },
  { n: 'APS-H', w: 27.90, h: 18.60, u: '1.3 倍裁切' },
  { n: '全画幅 36×24', w: 36.00, h: 24.00, u: '1.0 倍基准' },
  { n: '4433 中画幅', w: 44.00, h: 33.00, u: 'GFX / X1D' },
  { n: '645 中画幅', w: 53.00, h: 40.00, u: 'X2D / IQ4' },
  { n: '6×6 中画幅', w: 56.00, h: 56.00, u: '老式中画幅' },
  { n: '4×5 大画幅', w: 127.00, h: 101.60, u: '4×5 英寸' }
];
var DEFAULT_SENSOR = 9;
var FF_DIAG = Math.hypot(36, 24);
var CUSTOM = SENSORS.length;

var CATS = [
  { key: 'format', code: '10', title: '画幅 / 视场 / 采样', note: '焦距、画幅、像素密度、衍射' },
  { key: 'focus', code: '20', title: '景深 / 对焦', note: '景深、超焦距、微距、堆栈' },

/* ============================================================
   数学工具
   ============================================================ */
var DEG = Math.PI / 180;
function rad(d) { return d * DEG; }
function fovAngles(w, h, f) {
  var dg = Math.hypot(w, h);
  return {
    fh: 2 * Math.atan(w / (2 * f)) / DEG,
    fv: 2 * Math.atan(h / (2 * f)) / DEG,
    fd: 2 * Math.atan(dg / (2 * f)) / DEG,
    diag: dg
  };
}
function cropOf(w, h) { return FF_DIAG / Math.hypot(w, h); }
function cocOf(w, h) { return Math.hypot(w, h) / 1500; }
function hyperMM(f, N, c) { return f * f / (N * c) + f; }
function dofRange(f, N, s, c) {
  var H = hyperMM(f, N, c);
  var near = s * (H - f) / (H + s - 2 * f);
  var far = s < H ? s * (H - f) / (H - s) : Infinity;
  return { near: near, far: far, H: H };
}
function pitchUM(w, pxw) { return w * 1000 / pxw; }
function airyUM(N, lam) { return 2.44 * (lam || 0.55) * N; }
function ev100(N, t, iso) { return Math.log2(N * N / t) - Math.log2(iso / 100); }
function pixelAngleDeg(pitch, f) { return Math.atan((pitch / 1000) / f) / DEG; }
function mired(k) { return 1e6 / k; }
function colorTemp(m) { return 1e6 / m; }
function num(x, nd) {
  if (!isFinite(x)) return x > 0 ? '∞' : '—';
  var v = String(Number(Number(x).toFixed(nd === undefined ? 2 : nd)));
  var p = v.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
function fmtShutter(t) {
  if (!isFinite(t)) return '∞';
  if (t >= 60) return num(t / 60, 1) + ' min';
  if (t >= 1) return num(t, 1) + ' s';
  var d = 1 / t;
  if (d < 2) return num(t * 1000, 0) + ' ms';
  if (d < 1000) return '1/' + num(d, 0);
  return num(t * 1000, 2) + ' ms';
}
function parseShutter(str, fallback) {
  var t = String(str == null ? '' : str).trim().toLowerCase()
    .replace(/\s/g, '').replace(/秒/g, '').replace(/／/g, '/');
  var v;
  if (t.slice(-2) === 'ms') { v = parseFloat(t.slice(0, -2)) / 1000; }
  else if (t.slice(-1) === 's') { v = parseFloat(t.slice(0, -1)); }
  else if (t.indexOf('/') > -1) {
    var p = t.split('/');
    v = parseFloat(p[0]) / parseFloat(p[1]);
  } else { v = parseFloat(t); }
  return isFinite(v) && v > 0 ? v : fallback;
}
function nz(v, d) { return typeof v === 'number' && isFinite(v) ? v : d; }

/* ============================================================
   状态与工具
   ============================================================ */
var STORE = {};
var CALC_MAP = {};

function sen(v) {
  if (v.sensor === CUSTOM) {
    var w = nz(v.cw, 36), h = nz(v.ch, 24);
    return { w: w, h: h, n: '自定义' + num(w, 2).replace('.00', '') + '×' + num(h, 2).replace('.00', '') };
  }
  var s = SENSORS[v.sensor];
  return s || SENSORS[DEFAULT_SENSOR];
}
function lens(v) {
  var s = sen(v);
  var f = nz(v.f, 50);
  var dg = Math.hypot(s.w, s.h);
  var crop = FF_DIAG / dg;
  return { w: s.w, h: s.h, name: s.n, f: f, diag: dg, crop: crop, eqf: f * crop };
}
function defaultsOf(calc) {
  var o = {};
  calc.fields.forEach(function (f) {
    o[f.k] = f.kind === 'sensor' ? DEFAULT_SENSOR : (f.def !== undefined ? f.def : '');
  });
  if (calc.fields.some(function (f) { return f.kind === 'sensor'; })) {
    o.cw = 36; o.ch = 24;
  }
  return o;
}
function stateOf(calc) {
  if (!STORE[calc.id]) STORE[calc.id] = defaultsOf(calc);
  return STORE[calc.id];
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('on'); }, 1800);
}

var navEl = document.getElementById('nav');

function buildNav() {
  var html = '';
  CATS.forEach(function (cat) {
    var items = CALCS.filter(function (c) { return c.cat === cat.key; });
    html += '<div class="group" data-cat="' + cat.key + '">';
    html += '<h6><span class="dot">/</span>' + cat.code + ' ' + cat.title + '</h6>';
    items.forEach(function (c) {
      html += '<a class="navlink" href="#/c/' + c.id + '" data-id="' + c.id + '" data-text="' +
        (c.id + ' ' + c.name + ' ' + (c.brief || '') + ' ' + cat.title).toLowerCase() + '">' +
        '<span class="code">' + c.id + '</span><span>' + c.name + '</span></a>';
    });
    html += '</div>';
  });
  navEl.innerHTML = html;
}

function filterNav(q) {
  q = (q || '').trim().toLowerCase();
  var shown = 0;
  navEl.querySelectorAll('.group').forEach(function (g) {
    var catShown = 0;
    g.querySelectorAll('.navlink').forEach(function (a) {
      var hit = !q || a.dataset.text.indexOf(q) > -1;
      a.style.display = hit ? '' : 'none';
      if (hit) catShown++;
    });
    g.style.display = catShown ? '' : 'none';
    shown += catShown;
  });
  emptyEl.classList.toggle('on', shown === 0);
}
function markActive(id) {
  navEl.querySelectorAll('.navlink').forEach(function (a) {
    a.classList.toggle('active', a.dataset.id === String(id));
  });
}

/* ============================================================
   渲染：计算器
   ============================================================ */
function fieldHTML(f, v) {
  var hidden = f.when && !f.when(v);
  var cls = 'f' + (hidden ? ' hide' : '');
  var h = '<div class="' + cls + '" data-k="' + f.k + '">';
  h += '<label for="in_' + f.k + '">' + f.label + '</label><div class="inwrap">';

  if (f.kind === 'sensor') {
    h += '<select id="in_' + f.k + '" data-kind="sensor">';
    SENSORS.forEach(function (s, i) {
      h += '<option value="' + i + '"' + (v[f.k] === i ? ' selected' : '') + '>' +
        s.n + '　' + num(s.w, 2).replace('.00', '') + '×' + num(s.h, 2).replace('.00', '') + ' mm</option>';
    });
    h += '<option value="' + CUSTOM + '"' + (v[f.k] === CUSTOM ? ' selected' : '') + '>自定义尺寸</option>';
    h += '</select><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  } else if (f.kind === 'sel') {
    h += '<select id="in_' + f.k + '">';
    f.opts.forEach(function (o) {
      var val = Array.isArray(o) ? o[0] : o;
      var lab = Array.isArray(o) ? o[1] : o;
      h += '<option value="' + val + '"' + (v[f.k] === val ? ' selected' : '') + '>' + lab + '</option>';
    });
    h += '</select><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  } else if (f.kind === 'shutter') {
    h += '<input id="in_' + f.k + '" type="text" inputmode="decimal" value="' +
      (v[f.k] === undefined ? '' : fmtShutterInput(v[f.k])) + '" autocomplete="off">';
  } else {
    h += '<input id="in_' + f.k + '" type="number" step="' + (f.step || 'any') + '"' +
      (f.min !== undefined ? ' min="' + f.min + '"' : '') +
      (f.max !== undefined ? ' max="' + f.max + '"' : '') +
      ' value="' + (v[f.k] === undefined ? '' : v[f.k]) + '" autocomplete="off">';
    if (f.unit) h += '<span class="unit">' + f.unit + '</span>';
  }
  h += '</div>';
  if (f.hint) h += '<span class="hint">' + f.hint + '</span>';
  h += '</div>';
  return h;
}
function fmtShutterInput(t) {
  if (!isFinite(t)) return '';
  if (t >= 1) return String(Number(t.toFixed(3)));
  return '1/' + Math.round(1 / t);
}

function resHTML(calc, v) {
  var r;
  try {
    r = calc.calc(v);
  } catch (e) {
    return '<div class="err">参数组合无法计算：' + (e && e.message ? e.message : '请检查输入') + '</div>';
  }
  if (!r) return '';
  var h = '<div class="res"><div class="rlabel">RESULT / 计算结果</div><div class="outgrid">';
  (r.out || []).forEach(function (o) {
    h += '<div class="out' + (o.wide ? ' wide' : '') + '"><span class="k">' + o.k + '</span>' +
      '<span class="v' + (o.big ? ' big' : '') + (o.accent ? ' accent' : '') + '">' + o.v + '</span></div>';
  });
  h += '</div>';
  if (r.table) {
    var n = r.table.cols.length;
    h += '<div class="tbl"><table><colgroup>';
    h += '<col style="width:' + (n > 3 ? 26 : 34) + '%">';
    for (var i = 1; i < n; i++) h += '<col style="width:' + ((n > 3 ? 74 : 66) / (n - 1)) + '%">';
    h += '</colgroup><thead><tr>';
    r.table.cols.forEach(function (c) { h += '<th>' + c + '</th>'; });
    h += '</tr></thead><tbody>';
    r.table.rows.forEach(function (row) {
      h += '<tr>';
      row.forEach(function (c) { h += '<td>' + c + '</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  if (r.note) h += '<div class="note">' + r.note + '</div>';
  h += '</div>';
  return h;
}

function viewCalc(calc) {
  var v = stateOf(calc);
  var idx = CALCS.indexOf(calc);
  var prev = CALCS[idx - 1], next = CALCS[idx + 1];
  var cat = CATS.filter(function (c) { return c.key === calc.cat; })[0] || { title: '', code: '' };

  var h = '';
  h += '<div class="crumb"><a href="#/">全部功能</a><span class="sep">/</span>' +
    '<span>' + cat.code + ' ' + cat.title + '</span><span class="sep">/</span>' +
    '<span class="cur">' + calc.name + '</span></div>';

  h += '<header class="chead"><div class="num">' + calc.id + '</div><div class="meta">' +
    '<h2>' + calc.name + '</h2><p>' + (calc.brief || '') + '</p>' +
    '<div class="tagrow"><span class="tag">' + cat.title + '</span>' +
    (calc.tags || []).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') +
    '</div></div></header>';

  h += '<section class="panel"><div class="phead"><h4>输入参数</h4><div class="tools">' +
    '<button class="minibtn" id="resetBtn">恢复默认</button></div></div>' +
    '<div class="pbody"><div class="fields' + (calc.fields.length > 4 ? ' three' : '') + '" id="fields">';
  calc.fields.forEach(function (f) { h += fieldHTML(f, v); });
  h += '</div></div></section>';

  h += '<div id="resWrap">' + resHTML(calc, v) + '</div>';

  h += '<div class="pager">';
  h += prev ? '<a href="#/c/' + prev.id + '"><span>PREV / ' + prev.id + '</span><b>' + prev.name + '</b></a>' : '<span></span>';
  h += next ? '<a class="next" href="#/c/' + next.id + '"><span>NEXT / ' + next.id + '</span><b>' + next.name + '</b></a>' : '';
  h += '</div>';
  h += '<div class="ft"><span>结果随输入即时更新</span><span>' + calc.id + ' / 48</span></div>';
  return h;
}

function bindCalc(calc) {
  var v = stateOf(calc);
  var wrap = document.getElementById('resWrap');

  function refresh() {
    var r;
    wrap.innerHTML = resHTML(calc, v);
  }

  document.querySelectorAll('#fields [data-k]').forEach(function (box) {
    var k = box.dataset.k;
    var el = box.querySelector('input,select');
    if (!el) return;
    var field = calc.fields.filter(function (f) { return f.k === k; })[0];
    var evt = el.tagName === 'SELECT' ? 'change' : 'input';

    el.addEventListener(evt, function () {
      if (field.kind === 'sensor') {
        v[k] = el.value === String(CUSTOM) ? CUSTOM : Number(el.value);
        document.getElementById('fields').innerHTML = calc.fields.map(function (f) {
          return fieldHTML(f, v);
        }).join('');
        bindCalc(calc);
        return;
      }
      if (field.kind === 'sel') {
        v[k] = el.value;
      } else if (field.kind === 'shutter') {
        v[k] = parseShutter(el.value, v[k] || field.def);
      } else {
        var x = parseFloat(el.value);
        v[k] = isFinite(x) ? x : (field.def === undefined ? '' : field.def);
      }
      refresh();
    });
    if (field.kind === 'shutter') {
      el.addEventListener('blur', function () {
        el.value = fmtShutterInput(v[k]);
        refresh();
      });
    }
  });

  var reset = document.getElementById('resetBtn');
  if (reset) reset.addEventListener('click', function () {
    STORE[calc.id] = defaultsOf(calc);
    render();
    toast('已恢复默认值');
  });
}

/* ============================================================
   路由
   ============================================================ */
function render() {
  var view = document.getElementById('view');
  var hash = location.hash || '#/';
  var m = hash.match(/^#\/c\/(\d+)/);

  if (!m) {
    view.innerHTML = viewHome();
    markActive(null);
    document.title = '相机参数工具箱 · 48 项计算';
    window.scrollTo({ top: 0 });
    return;
  }
  var calc = CALC_MAP[m[1]];
  if (!calc) { location.hash = '#/'; return; }
  view.innerHTML = viewCalc(calc);
  bindCalc(calc);
  markActive(calc.id);
  document.title = calc.name + ' · 相机参数工具箱';
  window.scrollTo({ top: 0 });
  closeDrawer();
}

/* ============================================================
   抽屉 / 搜索 / 启动
   ============================================================ */
function openDrawer() {
  document.getElementById('side').classList.add('open');
  document.getElementById('scrim').style.visibility = 'visible';
  document.getElementById('scrim').style.opacity = '1';
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'true');
}
function closeDrawer() {
  if (window.innerWidth >= 900) return;
  document.getElementById('side').classList.remove('open');
  var sc = document.getElementById('scrim');
  sc.style.opacity = '0';
  sc.style.visibility = 'hidden';
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
}

function boot() {
  buildNav();
  CALCS.forEach(function (c) { CALC_MAP[c.id] = c; });
  document.getElementById('menuBtn').addEventListener('click', function () {
    var side = document.getElementById('side');
    if (side.classList.contains('open')) { closeDrawer(); } else { openDrawer(); }
  });
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.getElementById('q').addEventListener('input', function (e) {
    filterNav(e.target.value);
  });
  navEl.addEventListener('click', function (e) {
    var a = e.target.closest('.navlink');
    if (a) { closeDrawer(); }
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', function () {
    if (window.innerWidth >= 900) {
      document.getElementById('side').classList.remove('open');
      var sc = document.getElementById('scrim');
      sc.style.opacity = '0'; sc.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDrawer(); }
    if (e.key === '/' && document.activeElement !== document.getElementById('q')) {
      e.preventDefault();
      document.getElementById('q').focus();
    }
  });
  render();
}
/* ============================================================
   计算项定义
   ============================================================ */
var CALCS = [];

function fN(k, label, def, unit, hint, min, max) {
  return { k: k, label: label, kind: 'num', def: def, unit: unit || '', hint: hint || '', min: min, max: max };
}
function fS(k, label, opts, def) { return { k: k, label: label, kind: 'sel', opts: opts, def: def }; }
function fSen(label) { return { k: 'sensor', label: label || '传感器', kind: 'sensor' }; }
function fSh(k, label, def, hint) { return { k: k, label: label, kind: 'shutter', def: def, hint: hint || '' }; }
function O(k, v, extra) {
  var o = { k: k, v: v };
  if (extra) for (var x in extra) o[x] = extra[x];
  return o;
}

/* ---------- 10 画幅 / 视场 / 采样 ---------- */
CALCS.push(
{
  id: '11', cat: 'format', name: '视场角：焦距 → 视野', tags: ['FOV', '等效焦距'],
  brief: '给定画幅与物理焦距，算出水平、垂直、对角视场角，以及 1 米处的实际画面尺寸。',
  fields: [fSen(), fN('f', '物理焦距', 50, 'mm', '等效焦距会自动按裁切系数换算', 0.3, 5000)],
  calc: function (v) {
    var L = lens(v), a = fovAngles(L.w, L.h, L.f);
    return {
      out: [
        O('水平视场', num(a.fh, 2) + '°', { big: 1, accent: 1 }),
        O('垂直视场', num(a.fv, 2) + '°'),
        O('对角视场', num(a.fd, 2) + '°'),
        O('等效焦距', num(L.eqf, 1) + ' mm'),
        O('裁切系数', num(L.crop, 3) + '×'),
        O('传感器对角线', num(a.diag, 2) + ' mm'),
        O('1 m 处画面', num(2 * Math.tan(rad(a.fh / 2)), 3) + ' × ' + num(2 * Math.tan(rad(a.fv / 2)), 3) + ' m', { wide: 1 })
      ],
      note: '视场角只由「画幅尺寸 / 焦距」决定，与像素多少无关。'
    };
  }
},
{
  id: '12', cat: 'format', name: '反推焦距：目标要拍多大', tags: ['选镜头'],
  brief: '要在某个距离把目标铺满画面，需要多长的焦距。拍鸟、拍舞台、拍样品都用得上。',
  fields: [
    fSen(),
    fS('axis', '铺满哪个方向', [['w', '宽度（水平）'], ['h', '高度（垂直）'], ['d', '对角线']], 'w'),
    fN('dist', '拍摄距离', 10, 'm', '', 0.02, 100000),
    fN('target', '目标真实尺寸', 2, 'm', '沿上面选的方向量', 0.001, 100000)
  ],
  calc: function (v) {
    var L = lens(v);
    var dim = v.axis === 'w' ? L.w : v.axis === 'h' ? L.h : L.diag;
    var dist = nz(v.dist, 10), target = nz(v.target, 2);
    if (target <= 0) throw new Error('目标尺寸需大于 0');
    var f = dim * dist / target;
    var a = fovAngles(L.w, L.h, f);
    var eqf = f * cropOf(L.w, L.h);
    return {
      out: [
        O('所需物理焦距', num(f, 1) + ' mm', { big: 1, accent: 1 }),
        O('等效焦距', num(eqf, 0) + ' mm'),
        O('最接近的常规焦段', (function () {
          var list = [8, 12, 14, 16, 20, 24, 28, 35, 50, 85, 100, 135, 200, 300, 400, 600, 800];
          var best = list.reduce(function (p, c) { return Math.abs(c - eqf) < Math.abs(p - eqf) ? c : p; });
          return best + ' mm';
        })()),
        O('此时水平视场', num(a.fh, 1) + '°'),
        O('此时垂直视场', num(a.fv, 1) + '°'),
        O('画面放大率', num(dist / target, 2) + ' 倍距比', { wide: 1 })
      ],
      note: eqf > 800 ? '<b>提醒</b>等效焦距超过 800mm，属于超远摄，注意空气扰动与脚架稳定。'
        : eqf < 8 ? '<b>提醒</b>等效焦距小于 8mm，已是鱼眼级别，普通镜头难以实现。'
        : '距离 × 传感器尺寸 ÷ 目标尺寸 = 所需焦距，这是最直接的选镜头公式。'
    };
  }
},
{
  id: '13', cat: 'format', name: '画面尺寸：这个距离能拍多宽', tags: ['取景'],
  brief: '站在某处用某支镜头，画面里到底装得下多少米。布景、拍合影、拍建筑前先量一下。',
  fields: [fSen(), fN('f', '物理焦距', 35, 'mm', '', 0.3, 5000), fN('dist', '拍摄距离', 5, 'm', '', 0.02, 100000)],
  calc: function (v) {
    var L = lens(v), a = fovAngles(L.w, L.h, L.f), d = nz(v.dist, 5);
    return {
      out: [
        O('画面宽度', num(2 * d * Math.tan(rad(a.fh / 2)), 2) + ' m', { big: 1, accent: 1 }),
        O('画面高度', num(2 * d * Math.tan(rad(a.fv / 2)), 2) + ' m'),
        O('画面对角', num(2 * d * Math.tan(rad(a.fd / 2)), 2) + ' m'),
        O('每米画面宽', num(2 * Math.tan(rad(a.fh / 2)), 4) + ' m'),

        O('等效焦距', num(L.eqf, 0) + ' mm')
      ],
      note: '画面尺寸 = 2 × 距离 × tan(视场角 / 2)。想要更窄的画面，要么靠近，要么换长焦。'
    };
  }
},
{
  id: '14', cat: 'format', name: '裁切系数与等效焦距', tags: ['全画幅等效'],
  brief: '小画幅换算成全画幅视角，或者反过来：想得到某个等效焦距，实际该用多长的镜头。',
  fields: [
    fS('mode', '换算方向', [['a', '由传感器算裁切 / 等效焦距'], ['b', '已知等效焦距，求真焦距'], ['c', '两台相机同视角换算']], 'a'),
    fSen('相机 A 传感器'),
    fN('f', '物理焦距', 50, 'mm', '模式 b 时不填此项', 0.3, 5000, undefined),
    fN('eqf', '想达到的等效焦距', 50, 'mm', '仅模式 b 使用', 1, 3000),
    { k: 'sensor2', label: '相机 B 传感器', kind: 'sensor', def: DEFAULT_SENSOR, when: function (v) { return v.mode === 'c'; } }
  ],
  calc: function (v) {
    var L = lens(v), crop = L.crop;
    if (v.mode === 'b') {
      var eq = nz(v.eqf, 50) / crop;
      return {
        out: [
          O('所需物理焦距', num(eq, 2) + ' mm', { big: 1, accent: 1 }),
          O('裁切系数', num(crop, 3) + '×'),
          O('目标等效焦距', num(nz(v.eqf, 50), 0) + ' mm')
        ],
        note: '等效焦距 = 物理焦距 × 裁切系数。裁切系数只影响视角，不会改变曝光。'
      };
    }
    if (v.mode === 'c') {
      var s2 = SENSORS[v.sensor2] || SENSORS[DEFAULT_SENSOR];
      var c1 = cropOf(L.w, L.h), c2 = cropOf(s2.w, s2.h);
      var f2 = L.f * c1 / c2;
      return {
        out: [
          O('B 上要用的焦距', num(f2, 2) + ' mm', { big: 1, accent: 1 }),
          O('A 的等效焦距', num(L.f * c1, 0) + ' mm'),
          O('A 裁切 / B 裁切', num(c1, 2) + '× / ' + num(c2, 2) + '×'),
          O('B 设备', s2.n)
        ],
        note: '两台相机视角相同 ⟺ 物理焦距 × 裁切系数 相等。'
      };
    }
    var eqf = L.f * crop;
    return {
      out: [
        O('等效全画幅焦距', num(eqf, 1) + ' mm', { big: 1, accent: 1 }),
        O('裁切系数', num(crop, 4) + '×'),
        O('等效光圈（同景深）', 'F' + num(nz(v.n, 2.8) * crop, 1)),
        O('通光量差', num(2 * Math.log2(crop), 2) + ' 档')
      ],
      note: '裁切系数 = 43.27 mm ÷ 传感器对角线。想「同视角 + 同景深 + 同噪点」，小画幅要用更小的 F 值与更低的 ISO。'
    };
  }
},
{
  id: '15', cat: 'format', name: '像素规格：像元间距与密度', tags: ['像素', '打印上限'],
  brief: '知道传感器尺寸和像素数，就能算出像元大小、像素密度，以及 300dpi 下的最大打印尺寸。',
  fields: [
    fSen(),
    fN('pxw', '横向像素', 6000, 'px', '', 100, 200000),
    fN('pxh', '纵向像素', 4000, 'px', '', 100, 200000)
  ],
  calc: function (v) {
    var L = lens(v), pxw = nz(v.pxw, 6000), pxh = nz(v.pxh, 4000);
    var pitch = pitchUM(L.w, pxw);
    var mp = pxw * pxh / 1e6;
    var aspectPx = pxw / pxh, aspectS = L.w / L.h;
    return {
      out: [
        O('像元间距', num(pitch, 2) + ' um', { big: 1, accent: 1 }),
        O('总像素', num(mp, 2) + ' MP'),
        O('像素密度', num(1e4 / (pitch * pitch), 1) + ' 万 / cm²'),
        O('传感器面积', num(L.w * L.h / 100, 1) + ' cm²'),
        O('300 dpi 打印', num(pxw / 300 * 2.54, 1) + ' × ' + num(pxh / 300 * 2.54, 1) + ' cm'),
        O('200 dpi 打印', num(pxw / 200 * 2.54, 1) + ' × ' + num(pxh / 200 * 2.54, 1) + ' cm'),
        O('单像素张角（本焦距）', num(pixelAngleDeg(pitch, L.f) * 3600, 1) + ' 角秒', { wide: 1 })
      ],
      note: Math.abs(aspectPx - aspectS) / aspectS > 0.02
        ? '<b>注意</b>像素纵横比与传感器纵横比不一致，像元可能不是正方形，实际焦距会略微变形。'
        : '像元越小，理论分辨率越高，但更容易被衍射和噪声吃掉。'
    };
  }
},
{
  id: '16', cat: 'format', name: '衍射极限与艾里斑', tags: ['DLA', '最佳光圈'],
  brief: '像素越密，可用光圈反而越窄。这里给出开始可见软化的光圈值，以及各档的艾里斑大小。',
  fields: [fSen(), fN('pxw', '横向像素', 6000, 'px', '', 100, 200000)],
  calc: function (v) {
    var L = lens(v), pitch = pitchUM(L.w, nz(v.pxw, 6000));
    var rows = [1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22, 32].map(function (n) {
      var a = airyUM(n);
      var r = a / pitch;
      return ['F' + n, num(a, 2), num(r, 2), r < 1.5 ? '轻微' : r < 3 ? '可见' : '明显'];
    });
    return {
      out: [
        O('开始可见软化', 'F' + num(1.49 * pitch, 1), { big: 1, accent: 1 }),
        O('明显损失细节', 'F' + num(2.98 * pitch, 1)),
        O('建议日常上限', 'F' + num(1.8 * pitch, 1)),
        O('像元间距', num(pitch, 2) + ' um')
      ],
      table: { cols: ['光圈', '艾里斑 um', '占像素', '影响'], rows: rows },
      note: '绿光 550nm：艾里斑直径 = 2.44 × 波长 × 光圈值。小于 1.5 像素基本看不出，超过 3 像素就明显发软。'
    };
  }
},
{
  id: '17', cat: 'format', name: '跨画幅等效换算', tags: ['换门', '等效光圈'],
  brief: '从一套系统换到另一套，要拿到同样的视角、景深和噪点，焦距 / 光圈 / ISO 各该怎么换。',
  fields: [
    fSen('原设备传感器'),
    fN('f', '原镜头焦距', 50, 'mm', '', 0.3, 5000),
    fN('n', '原光圈', 2.8, 'F', '', 0.5, 128),
    fN('iso', '原 ISO', 100, 'ISO', '', 6, 409600),
    { k: 'sensor2', label: '目标设备传感器', kind: 'sensor', def: DEFAULT_SENSOR }
  ],
  calc: function (v) {
    var A = lens(v);
    var s2 = SENSORS[v.sensor2] || SENSORS[DEFAULT_SENSOR];
    var c1 = cropOf(A.w, A.h), c2 = cropOf(s2.w, s2.h);
    var k = c2 / c1;
    return {
      out: [
        O('同视角所需焦距', num(A.f * k, 1) + ' mm', { big: 1, accent: 1 }),
        O('同景深所需光圈', 'F' + num(nz(v.n, 2.8) * k, 2)),
        O('同噪点所需 ISO', 'ISO' + num(nz(v.iso, 100) * k * k, 0)),
        O('两机视角', '一致'),
        O('通光量差', num(-2 * Math.log2(k), 2) + ' 档'),
        O('目标画幅裁切', num(c2, 2) + '×')
      ],
      note: '小画幅要同时满足「同视角 + 同景深 + 同噪点」，必须用更小的 F 值与更低的 ISO，这是物理限制，不是镜头不行。'
    };
  }
},
{
  id: '18', cat: 'format', name: '裁切后还剩多少像素', tags: ['二次构图'],
  brief: '后期裁一刀，像素和视角都会变。先算清楚还能印多大，避免裁完不够用。',
  fields: [
    fSen(),
    fN('pxw', '原图横向像素', 6000, 'px', '', 100, 200000),
    fN('pxh', '原图纵向像素', 4000, 'px', '', 100, 200000),
    fN('ratio', '裁切倍率', 1.5, '×', '1.5 = 线性尺寸只剩 1/1.5', 1, 8)
  ],
  calc: function (v) {
    var L = lens(v), r = nz(v.ratio, 1.5);
    var pxw = nz(v.pxw, 6000), pxh = nz(v.pxh, 4000);
    var before = pxw * pxh / 1e6, after = (pxw / r) * (pxh / r) / 1e6;
    return {
      out: [
        O('裁切后像素', num(after, 2) + ' MP', { big: 1, accent: 1 }),
        O('裁切后尺寸', Math.round(pxw / r) + ' × ' + Math.round(pxh / r) + ' px'),
        O('像素损失', num((1 - after / before) * 100, 1) + '%'),
        O('视角变化', '等效 ×' + num(r, 1) + '（' + num(L.eqf, 0) + ' → ' + num(L.eqf * r, 0) + ' mm）'),
        O('300 dpi 长边', num(pxw / r / 300 * 2.54, 1) + ' cm')
      ],
      note: '裁切不创造细节：它只是把已有像素放大，噪点、色散、衍射都会一起被放大。'
    };
  }
}
);

/* ---------- 20 景深 / 对焦 ---------- */
CALCS.push(
{
  id: '21', cat: 'focus', name: '景深与超焦距', tags: ['DOF', '弥散圆'],
  brief: '给定焦距、光圈、对焦距离，算出清晰范围的两端，以及让远景到无穷的超焦距。',
  fields: [fSen(), fN('f', '物理焦距', 50, 'mm', '', 0.3, 5000), fN('n', '光圈', 2.8, 'F', '', 0.5, 128), fN('dist', '对焦距离', 3, 'm', '', 0.01, 100000)],
  calc: function (v) {
    var L = lens(v), c = cocOf(L.w, L.h);
    var d = dofRange(L.f, nz(v.n, 2.8), nz(v.dist, 3) * 1000, c);
    var total = d.far === Infinity ? Infinity : d.far - d.near;
    return {
      out: [
        O('清晰近界', num(d.near / 1000, 3) + ' m', { big: 1 }),
        O('清晰远界', d.far === Infinity ? '∞' : num(d.far / 1000, 3) + ' m', { big: 1 }),
        O('总景深', total === Infinity ? '∞' : num(total / 1000, 3) + ' m'),
        O('超焦距', num(d.H / 1000, 2) + ' m', { accent: 1 }),
        O('允许弥散圆', num(c * 1000, 1) + ' um'),
        O('对焦 / 超焦距', num(nz(v.dist, 3) * 1000 / d.H * 100, 1) + '%')
      ],
      note: nz(v.dist, 3) * 1000 >= d.H
        ? '已超过超焦距，远界为无穷远；此时再往远对焦，只会白白损失近景。'
        : '弥散圆按「对角线 / 1500」计算，比传统 0.03mm 略严格，适合高像素机身。'
    };
  }
},
{
  id: '22', cat: 'focus', name: '景深表：各光圈对比', tags: ['表格'],
  brief: '同一构图下把光圈从 F1.4 收到 F22，近界、远界、总景深怎么变。',
  fields: [fSen(), fN('f', '物理焦距', 50, 'mm', '', 0.3, 5000), fN('dist', '对焦距离', 3, 'm', '', 0.01, 100000)],
  calc: function (v) {
    var L = lens(v), c = cocOf(L.w, L.h), d0 = nz(v.dist, 3) * 1000;
    var rows = [1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22].map(function (n) {
      var d = dofRange(L.f, n, d0, c);
      var total = d.far === Infinity ? Infinity : (d.far - d.near) / 1000;
      return ['F' + n, num(d.H / 1000, 2), num(d.near / 1000, 2),
        d.far === Infinity ? '∞' : num(d.far / 1000, 2),
        total === Infinity ? '∞' : num(total, 2) + ' m'];
    });
    return {
      out: [O('镜头', L.f + ' mm（' + L.name + '）'), O('对焦距离', num(nz(v.dist, 3), 2) + ' m'), O('弥散圆', num(c * 1000, 1) + ' um')],
      table: { cols: ['光圈', '超焦距 m', '近界 m', '远界 m', '总景深'], rows: rows },
      note: '光圈每收小一档，景深约增加 √2 倍；而近界变化远小于远界，这就是「对焦往前放一点更划算」的原因。'
    };
  }
},
{
  id: '23', cat: 'focus', name: '超焦距对焦法', tags: ['风光', '全清晰'],
  brief: '想让前景到无穷都清晰：对焦到 2 倍近界，光圈收到理论值即可，不必死对无穷远。',
  fields: [fSen(), fN('f', '物理焦距', 24, 'mm', '', 0.3, 5000), fN('near', '希望从多远开始清晰', 1, 'm', '', 0.05, 10000)],
  calc: function (v) {
    var L = lens(v), c = cocOf(L.w, L.h), x = nz(v.near, 1) * 1000;
    var nReq = L.f * L.f / (c * (2 * x - L.f));
    var list = [1.4, 1.8, 2, 2.8, 3.5, 4, 5.6, 8, 11, 16, 22, 32, 45, 64];
    var pick = list.filter(function (n) { return n >= nReq; })[0] || 64;
    var d = dofRange(L.f, pick, 2 * x, c);
    return {
      out: [
        O('建议光圈', 'F' + pick, { big: 1, accent: 1 }),
        O('对焦距离', num(2 * x / 1000, 2) + ' m'),
        O('实际近界', num(d.near / 1000, 2) + ' m'),
        O('实际远界', d.far === Infinity ? '∞' : num(d.far / 1000, 2) + ' m'),
        O('理论光圈', 'F' + num(nReq, 2)),
        O('超焦距', num(d.H / 1000, 2) + ' m')
      ],
      note: '对焦在 2 倍近界、用够小的光圈，就能把近景到无穷全部纳入景深，这是风光摄影最常用的一招。'
    };
  }
},
{
  id: '24', cat: 'focus', name: '放大倍率与微距景深', tags: ['微距', '有效光圈'],
  brief: '物距或工作距离换算成放大倍率，同时给出覆盖范围、有效光圈与微距景深。',
  fields: [
    fSen(), fN('f', '物理焦距', 100, 'mm', '', 0.3, 5000), fN('n', '光圈', 5.6, 'F', '', 0.5, 128),
    fS('mode', '已知哪个量', [['a', '对焦距离（从传感器平面起算）'], ['b', '工作距离（从镜头前端起算，近似）'], ['c', '已知放大倍率']], 'a'),
    fN('u', '对焦距离', 0.5, 'm', '模式 a 使用', 0.01, 100),
    fN('wd', '工作距离', 300, 'mm', '模式 b 使用', 1, 5000),
    fN('mag', '放大倍率', 1, '×', '模式 c 使用', 0.01, 20)
  ],
  calc: function (v) {
    var L = lens(v), N = nz(v.n, 5.6), m;
    if (v.mode === 'b') m = L.f / nz(v.wd, 300);
    else if (v.mode === 'c') m = nz(v.mag, 1);
    else {
      var u = nz(v.u, 0.5) * 1000;
      if (u <= L.f) throw new Error('对焦距离必须大于焦距');
      m = L.f / (u - L.f);
    }
    var c = cocOf(L.w, L.h);
    var nEff = N * (1 + m);
    var dof = 2 * nEff * c * (1 + m) / (m * m);
    return {
      out: [
        O('放大倍率', num(m, 3) + ' X', { big: 1, accent: 1 }),
        O('比例', '1 : ' + num(1 / m, 1)),
        O('画面覆盖', num(L.w / m, 1) + ' × ' + num(L.h / m, 1) + ' mm'),
        O('有效光圈', 'F' + num(nEff, 2)),
        O('近摄光损失', num(2 * Math.log2(1 + m), 2) + ' 档'),
        O('微距总景深', num(dof, 2) + ' mm')
      ],
      note: v.mode === 'b'
        ? '<b>近似模型</b>工作距离法只做快速估算；镜头内对焦会缩短有效焦距，真实倍率以标称值为准。'
        : '微距景深按「2 · N_eff · c · (1+m) / m²」估算，倍率越高景深塌得越快。'
    };
  }
},
{
  id: '25', cat: 'focus', name: '近摄接圈与增距镜', tags: ['微距', '增距'],
  brief: '加接圈能提倍率但丢无穷远，加增距镜加焦距又加倍率，各自的光圈代价也一起算。',
  fields: [
    fSen(), fN('f', '镜头焦距', 50, 'mm', '', 0.3, 5000), fN('mag0', '原生放大倍率', 0.15, '×', '普通镜头约 0.15', 0, 10),
    fN('ext', '接圈总长度', 0, 'mm', '没有就填 0', 0, 300), fN('tc', '增距镜倍率', 1, '×', '没有就填 1', 1, 3),
    fN('n', '光圈', 5.6, 'F', '', 0.5, 128)
  ],
  calc: function (v) {
    var L = lens(v), tc = nz(v.tc, 1), m0 = nz(v.mag0, 0.15), ext = nz(v.ext, 0), N = nz(v.n, 5.6);
    var fNew = L.f * tc;
    var m = m0 * tc + ext / fNew;
    var nEff = N * tc * (1 + m);
    return {
      out: [
        O('加装后焦距', num(fNew, 1) + ' mm'),
        O('加装后倍率', num(m, 3) + ' X', { big: 1, accent: 1 }),
        O('等效光圈', 'F' + num(nEff, 2)),
        O('画面覆盖', num(L.w / m, 1) + ' × ' + num(L.h / m, 1) + ' mm'),
        O('倍率提升', num(m / (m0 || 1), 2) + ' ×')
      ],

{
  id: '26', cat: 'focus', name: '焦点堆栈步进', tags: ['景深合成'],

{

CALCS.push(
{
  id: '31', cat: 'expo', name: 'EV 与曝光求解', tags: ['曝光三角', 'EV100'],

    var near = scenes.reduce(function (p, c) { return Math.abs(c[0] - realEv) < Math.abs(p[0] - realEv) ? c : p; });

  }
},
{
  id: '32', cat: 'expo', name: '曝光等值组合表', tags: ['表格', '换算'],

{

{

{

{

        O('判断', tAdj > tStar ? '会拖线，需缩短或提高 ISO' : '星点可保持圆'),
        O('等效焦距', num(L.eqf, 0) + ' mm')
      ],
      note: '极光亮度变化很快，短曝多拍再挑比长曝一张稳；绿色为主时白平衡 3800~4200K，偏紫则往 3200K 走。'
    };
  }
},
{
  id: '67', cat: 'astro', name: '日月食曝光阶梯', tags: ['日食', '月食'],
  brief: '日食要减光、月食不用；不同阶段的曝光差很大，先列好阶梯再上脚架。',
  fields: [
    fSen(), fN('f', '物理焦距', 400, 'mm', '', 0.3, 5000), fN('n', '光圈', 8, 'F', '', 0.5, 128),
    fS('type', '类型', [['s', '日食（偏食 / 环食）'], ['t', '日全食（全食阶段）'], ['l', '月食']], 's')
  ],
  calc: function (v) {
    var L = lens(v), N = nz(v.n, 8);
    var rows, note;
    if (v.type === 'l') {
      rows = [
        ['满月', '1/500', 'ISO100'],
        ['初亏 / 复圆', '1/250', 'ISO200'],
        ['食分 50%', '1/60', 'ISO400'],
        ['全食（偏暗）', '2s', 'ISO1600'],
        ['全食（血月）', '8s', 'ISO3200']
      ];
      note = '月食不需要任何减光镜；全食阶段亮度骤降，快门要跨 10 档以上，建议用包围。';
    } else if (v.type === 't') {
      rows = [
        ['钻石环', '1/1000', 'ISO100'],
        ['日冕（内）', '1/250', 'ISO100'],
        ['日冕（外）', '1/60', 'ISO100'],
        ['日珥', '1/500', 'ISO100'],
        ['地球照', '1/8', 'ISO400']
      ];
      note = '只有全食阶段可以摘下滤镜，且必须精确掐表；生光前后必须立即装回巴德膜。';
    } else {
      rows = [
        ['偏食（巴德膜）', '1/1000', 'ISO100'],
        ['偏食（ND5）', '1/500', 'ISO100'],
        ['初亏', '1/2000', 'ISO100'],
        ['食甚（未全食）', '1/1500', 'ISO100']
      ];
      note = '偏食与环食严禁裸眼或裸镜头直对太阳，必须用巴德膜 / ND5 级减光，否则会烧毁传感器与眼睛。';
    }
    return {
      out: [
        O('当前设置', 'F' + N + ' · ' + L.f + ' mm'),
        O('等效焦距', num(L.eqf, 0) + ' mm'),
        O('安全提示', v.type === 'l' ? '无需减光' : '必须减光', { accent: 1 })
      ],
      table: { cols: ['阶段', '快门', 'ISO'], rows: rows },
      note: note
    };
  }
},
{
  id: '68', cat: 'astro', name: '天体在画面上的大小', tags: ['角秒'],
  brief: '已知天体角直径，换算成传感器上的毫米与像素，判断要不要加增距镜。',
  fields: [
    fSen(), fN('f', '物理焦距', 300, 'mm', '', 0.3, 50000), fN('pxw', '横向像素', 6000, 'px', '', 100, 200000),
    fN('arcsec', '天体角直径', 40, '角秒', '木星约 40"，月面约 1860"', 0.01, 5000)
  ],
  calc: function (v) {
    var L = lens(v), pitch = pitchUM(L.w, nz(v.pxw, 6000));
    var scale = 206.265 * pitch / L.f;
    var px = nz(v.arcsec, 40) / scale;
    return {
      out: [
        O('像面直径', num(nz(v.arcsec, 40) / 206265 * L.f, 4) + ' mm', { big: 1 }),
        O('占像素', num(px, 1) + ' px', { big: 1, accent: 1 }),
        O('单像素张角', num(scale, 2) + ' 角秒'),
        O('建议', px < 50 ? '偏小，建议加增距或换长焦' : '尺寸合适'),
        O('整幅视场', num(L.w / L.f * 3437.75, 1) + ' × ' + num(L.h / L.f * 3437.75, 1) + ' 角分')
      ],
      note: '行星摄影一般希望目标占 100~300 像素；低于 50 像素基本只能拍成一个点。'
    };
  }
},
{
  id: '69', cat: 'astro', name: '赤道仪追踪精度', tags: ['跟踪'],
  brief: '极轴没对准，长曝就会拖线。按误差和曝光时长算拖了多少像素。',
  fields: [
    fSen(), fN('f', '物理焦距', 300, 'mm', '', 0.3, 5000), fN('pxw', '横向像素', 6000, 'px', '', 100, 200000),
    fN('err', '极轴误差', 5, '角分', '', 0, 120), fN('t', '单张曝光', 300, 's', '', 0.1, 3600)
  ],
  calc: function (v) {
    var L = lens(v), pitch = pitchUM(L.w, nz(v.pxw, 6000));
    var scale = 206.265 * pitch / L.f;
    var errArc = nz(v.err, 5) * 60;
    var px = errArc * nz(v.t, 300) / 3600 / scale;
    var limit = scale * 3600 / (errArc || 1);
    return {
      out: [
        O('拖线像素', num(px, 2) + ' px', { big: 1, accent: px > 2 ? 1 : 0 }),
        O('5 像素允许时长', num(limit * 5 / 60, 1) + ' 分'),
        O('单像素张角', num(scale, 2) + ' 角秒'),
        O('误差', errArc + ' 角秒')
      ],
      note: px > 2 ? '<b>会拖线</b>：缩短单张、多拍叠加，或重新对极轴（用极轴镜 / 漂移法）。' : '在 2 像素内，长曝可用。'
    };
  }
},
{
  id: '70', cat: 'astro', name: '航测 GSD 与覆盖面积', tags: ['无人机', '测绘'],
  brief: '飞多高能拿到多少厘米的地面分辨率，一块地要飞几条航线、几张片子。',
  fields: [
    fSen(), fN('f', '物理焦距', 24, 'mm', '', 0.3, 5000), fN('pxw', '横向像素', 6000, 'px', '', 100, 200000),
    fN('pxh', '纵向像素', 4000, 'px', '', 100, 200000), fN('alt', '相对地面高度', 120, 'm', '', 1, 5000),
    fN('areaW', '测区宽度', 1000, 'm', '', 1, 100000), fN('areaH', '测区长度', 1000, 'm', '', 1, 100000),
    fN('fwd', '航向重叠', 0.8, '', '0.7~0.85', 0.1, 0.95), fN('side', '旁向重叠', 0.7, '', '0.6~0.8', 0.1, 0.95)
  ],
  calc: function (v) {
    var L = lens(v), pitch = pitchUM(L.w, nz(v.pxw, 6000)), alt = nz(v.alt, 120);
    var gsd = alt * pitch / (L.f * 1000);
    var wCover = nz(v.pxw, 6000) * gsd, hCover = nz(v.pxh, 4000) * gsd;
    var lines = Math.ceil(nz(v.areaW, 1000) / (wCover * (1 - nz(v.side, 0.7))));
    var perLine = Math.ceil(nz(v.areaH, 1000) / (hCover * (1 - nz(v.fwd, 0.8))));
    var total = lines * perLine;
    return {
      out: [
        O('地面分辨率 GSD', num(gsd * 100, 1) + ' cm/px', { big: 1, accent: 1 }),
        O('单张覆盖', num(wCover, 0) + ' × ' + num(hCover, 0) + ' m'),
        O('航线数 / 每线张数', lines + ' 条 / ' + perLine + ' 张'),
        O('总张数', total + ' 张', { big: 1 }),
        O('飞行总里程', num(lines * nz(v.areaH, 1000) / 1000, 2) + ' km'),
        O('成图比例尺', '1 : ' + num(alt * 1000 / L.f, 0))
      ],
      note: 'GSD = 高度 × 像元间距 ÷ 焦距。重叠率越高重建越稳，但张数与处理时间成倍增加，航测常用 80% / 70%。'
    };
  }
}
);

/* ---------- 70 打印 / 色彩 / 画质 ---------- */
CALCS.push(
{
  id: '71', cat: 'print', name: '打印尺寸与 dpi', tags: ['输出'],
  brief: '像素、dpi、成品尺寸三者互换。印前先确认够不够 300dpi。',
  fields: [
    fS('mode', '求什么', [['a', '像素 + dpi → 成品尺寸'], ['b', '成品尺寸 + dpi → 所需像素'], ['c', '像素 + 成品尺寸 → 实际 dpi']], 'a'),
    fN('pxw', '横向像素', 6000, 'px', '', 100, 200000),
    fN('pxh', '纵向像素', 4000, 'px', '', 100, 200000),
    fN('dpi', '输出 dpi', 300, 'dpi', '画册 300，海报 150~200', 30, 1200),
    fN('wcm', '成品宽', 30, 'cm', '模式 b / c 使用', 0.1, 500),
    fN('hcm', '成品高', 20, 'cm', '模式 b / c 使用', 0.1, 500)
  ],
  calc: function (v) {
    var pxw = nz(v.pxw, 6000), pxh = nz(v.pxh, 4000), dpi = nz(v.dpi, 300);
    if (v.mode === 'b') {
      return {
        out: [
          O('所需像素', Math.round(nz(v.wcm, 30) / 2.54 * dpi) + ' × ' + Math.round(nz(v.hcm, 20) / 2.54 * dpi), { big: 1, accent: 1 }),
          O('总像素', num(nz(v.wcm, 30) / 2.54 * dpi * nz(v.hcm, 20) / 2.54 * dpi / 1e6, 1) + ' MP'),
          O('成品尺寸', num(nz(v.wcm, 30), 1) + ' × ' + num(nz(v.hcm, 20), 1) + ' cm')
        ],
        note: '按 300dpi 准备最稳；大幅面海报按 150dpi 也够，观看距离越远要求越低。'
      };
    }
    if (v.mode === 'c') {
      var realDpi = pxw / (nz(v.wcm, 30) / 2.54);
      return {
        out: [
          O('实际 dpi', num(realDpi, 1) + ' dpi', { big: 1, accent: realDpi < 300 ? 1 : 0 }),
          O('判断', realDpi >= 300 ? '精细印刷足够' : realDpi >= 200 ? '常规印刷可接受' : realDpi >= 150 ? '海报 / 远观可用' : '偏低，需放大处理'),
          O('成品尺寸', num(nz(v.wcm, 30), 1) + ' × ' + num(nz(v.hcm, 20), 1) + ' cm')
        ],
        note: 'dpi 低于 150 时，靠插值放大只是把像素摊开，不会长出新细节。'
      };
    }
    return {
      out: [
        O('成品尺寸', num(pxw / dpi * 2.54, 1) + ' × ' + num(pxh / dpi * 2.54, 1) + ' cm', { big: 1, accent: 1 }),
        O('英寸', num(pxw / dpi, 1) + ' × ' + num(pxh / dpi, 1) + ' in'),
        O('150 dpi 下', num(pxw / 150 * 2.54, 1) + ' × ' + num(pxh / 150 * 2.54, 1) + ' cm'),
        O('总像素', num(pxw * pxh / 1e6, 1) + ' MP')
      ],
      note: '同一张图，dpi 定得越低印得越大，但细节密度也越低。'
    };
  }
},
{
  id: '72', cat: 'print', name: '观看距离与可接受弥散圆', tags: ['CoC'],
  brief: '弥散圆该取多少，取决于「谁在多远看多大一张」。按观看条件反推，而不是死记 0.03mm。',
  fields: [
    fSen(), fN('f', '物理焦距', 50, 'mm', '', 0.3, 5000),
    fN('view', '观看距离', 50, 'cm', '', 5, 500),
    fN('print', '成品长边', 60, 'cm', '', 5, 1000),
    fN('arcmin', '人眼分辨力', 1.5, '角分', '1~2 之间', 0.5, 5)
  ],
  calc: function (v) {
    var L = lens(v), view = nz(v.view, 50), pr = nz(v.print, 60), am = nz(v.arcmin, 1.5);
    var cPrint = 2 * view * 10 * Math.tan(rad(am / 60 / 2));
    var cSensor = cPrint * Math.max(L.w, L.h) / (pr * 10);
    var classic = cocOf(L.w, L.h);
    return {
      out: [
        O('可接受弥散圆', num(cSensor * 1000, 1) + ' um', { big: 1, accent: 1 }),
        O('印刷面上弥散圆', num(cPrint, 3) + ' mm'),
        O('1500 法则值', num(classic * 1000, 1) + ' um'),
        O('换算所需像素', num(L.w / cSensor, 0) + ' px 长边'),
        O('判断', Math.abs(cSensor - classic) / classic > 0.5 ? '与常规值差异较大' : '与常规值接近')
      ],
      note: '同一张图印得越大、看得越近，弥散圆就要越小；反过来，大幅面远观其实要求很松。'
    };
  }
},
{
  id: '73', cat: 'print', name: '全景接片规划', tags: ['接片'],
  brief: '要拍到多少度、用几排、重叠留多少，一共多少张。接片前先算清楚。',
  fields: [
    fSen(), fN('f', '物理焦距', 35, 'mm', '', 0.3, 5000),
    fN('angle', '目标水平视角', 180, '°', '', 10, 720),
    fN('overlap', '重叠率', 0.3, '', '建议 0.25~0.4', 0.05, 0.9),
    fN('rows', '排数', 1, '', '竖构图多排可提高像素', 1, 5)
  ],
  calc: function (v) {
    var L = lens(v), a = fovAngles(L.w, L.h, L.f);
    var step = a.fh * (1 - nz(v.overlap, 0.3));
    var perRow = Math.max(1, Math.ceil(nz(v.angle, 180) / step));
    var rows = Math.round(nz(v.rows, 1));
    var total = perRow * rows;
    return {
      out: [
        O('单张水平视场', num(a.fh, 2) + '°'),
        O('每张有效转角', num(step, 2) + '°'),
        O('每排张数', perRow + ' 张', { big: 1, accent: 1 }),
        O('总张数', total + ' 张', { big: 1 }),
        O('成片角度', num(a.fh + step * (perRow - 1), 1) + '° × ' + num(a.fv + (rows - 1) * a.fv * (1 - nz(v.overlap, 0.3)), 1) + '°')
      ],
      note: '接片必须手动曝光与固定白平衡，否则拼缝会露；云动时间要用最短总拍摄时长，宁快勿慢。'
    };
  }
},
{
  id: '74', cat: 'print', name: '色温与 mired 校正', tags: ['白平衡', '滤镜'],
  brief: '开尔文与 mired 互换，算加雷登滤镜 / 调白平衡该偏多少。',
  fields: [
    fS('mode', '求什么', [['a', '色温 → mired 与偏移量'], ['b', 'mired 偏移 → 新色温'], ['c', '两处光源 → 差值']], 'a'),
    fN('k', '当前色温', 5600, 'K', '', 1000, 12000),
    fN('shift', 'mired 偏移', -40, 'mired', '负值 = 更冷（加蓝）', -300, 300),
    fN('ka', '光源 A', 3200, 'K', '', 1000, 12000),
    fN('kb', '光源 B', 5600, 'K', '', 1000, 12000)
  ],
  calc: function (v) {
    if (v.mode === 'b') {
      var m0 = mired(nz(v.k, 5600)) + nz(v.shift, -40);
      return {
        out: [
          O('新色温', num(colorTemp(m0), 0) + ' K', { big: 1, accent: 1 }),
          O('新 mired', num(m0, 1)),
          O('原 mired', num(mired(nz(v.k, 5600)), 1)),
          O('偏移', (nz(v.shift, -40) > 0 ? '+' : '') + nz(v.shift, -40) + ' mired')
        ],
        note: 'mired = 1,000,000 / K。mired 是等间隔的暖冷刻度，摄影滤镜与白平衡都按它标定。'
      };
    }
    if (v.mode === 'c') {
      var d = mired(nz(v.kb, 5600)) - mired(nz(v.ka, 3200));
      return {
        out: [
          O('mired 差', (d > 0 ? '+' : '') + num(d, 1)),
          O('色温差', num(nz(v.kb, 5600) - nz(v.ka, 3200), 0) + ' K'),
          O('需补', d < 0 ? '加暖（琥珀 / 降色温）' : '加冷（蓝 / 升色温）'),
          O('近似档数', num(Math.abs(d) / 40, 2) + ' 档（1 档约 40 mired）')
        ],
        note: '同场景多光源混色时，先决定以谁为准，再用 mired 差去补另一侧。'
      };
    }
    var k = nz(v.k, 5600);
    var rows = [[2000, '烛光'], [3200, '钨丝灯'], [4000, '荧光 / 日出'], [5600, '日光'], [6500, '阴天'], [7500, '蓝调时刻'], [9000, '阴影 / 蓝天']].map(function (r) {
      return [r[0] + ' K', num(mired(r[0]), 0), r[1]];
    });
    return {
      out: [
        O('mired', num(mired(k), 1), { big: 1, accent: 1 }),
        O('类别', k < 3000 ? '夜间 / 烛光' : k < 4000 ? '暖光（钨丝）' : k < 5200 ? '中性偏暖' : k < 6200 ? '日光' : k < 7500 ? '阴天偏冷' : '强冷 / 蓝调'),
        O('相对日光', num(mired(k) - mired(5600), 0) + ' mired')
      ],
      table: { cols: ['色温', 'mired', '典型场景'], rows: rows },
      note: '以 5600K 为基准：mired 越小越冷（偏蓝），越大越暖（偏黄）。'
    };
  }
},
{
  id: '75', cat: 'print', name: '动态范围估算', tags: ['DR', '宽容度'],
  brief: '满阱容量与读出噪声决定理论动态范围，再按 ISO 打折。',
  fields: [
    fN('fwc', '满阱容量', 60000, 'e-', '全画幅约 5~8 万', 100, 1000000),
    fN('rn', '读出噪声', 3, 'e-', '现代传感器 2~5', 0.1, 60),
    fN('iso', '拍摄 ISO', 100, 'ISO', '', 6, 409600),
    fN('base', '基准 ISO', 100, 'ISO', '', 6, 4096)
  ],
  calc: function (v) {
    var dr = Math.log2(nz(v.fwc, 60000) / nz(v.rn, 3));
    var drop = Math.log2(nz(v.iso, 100) / nz(v.base, 100));
    var real = dr - drop;
    return {
      out: [
        O('理论动态范围', num(dr, 1) + ' 档', { big: 1 }),
        O('当前 ISO 下', num(real, 1) + ' 档', { big: 1, accent: 1 }),
        O('可用高光余量', num(real * 0.4, 1) + ' 档（约 40%）'),
        O('ISO 提升损失', num(drop, 1) + ' 档'),
        O('判断', real >= 12 ? '优秀' : real >= 10 ? '良好' : real >= 8 ? '一般' : '局促')
      ],
      note: 'ISO 每翻倍约损失 1 档动态范围。为保高光，风光常欠曝 1/3~1 档再拉回。'
    };
  }
}
);

/* 传感器「自定义尺寸」字段：自动补到每个含传感器的计算项 */
CALCS.forEach(function (c) {
  if (c.fields.some(function (f) { return f.kind === 'sensor'; })) {
    c.fields.push({
      k: 'cw', label: '自定义宽度', kind: 'num', def: 36, unit: 'mm',
      hint: '选「自定义尺寸」时生效', min: 0.5, max: 1000,
      when: function (v) { return v.sensor === CUSTOM; }
    });
    c.fields.push({
      k: 'ch', label: '自定义高度', kind: 'num', def: 24, unit: 'mm',
      hint: '选「自定义尺寸」时生效', min: 0.5, max: 1000,
      when: function (v) { return v.sensor === CUSTOM; }
    });
  }
});

boot();
